name: Dependabot Rebase

on:
    push:
        branches: [main]
    workflow_run:
        workflows: [Dependabot Auto-Merge, CI]
        types: [completed]
    schedule:
        - cron: '7,22,37,52 * * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: dependabot-rebase-${{ github.repository }}
    cancel-in-progress: false

jobs:
    rebase:
        if: >-
            vars.ENABLE_DEPENDABOT_REBASE == 'true' &&
            (github.event_name != 'workflow_run' ||
            (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_repository.full_name == github.repository))
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout trusted main automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  persist-credentials: false
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.4
            - name: Request rebases for outdated auto-merge branches
              env:
                  GH_TOKEN: ${{ secrets.DEPENDABOT_REBASE_TOKEN }}
              run: bun .github/scripts/security/rebase-dependabot.ts
