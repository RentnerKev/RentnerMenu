name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.4

            - name: Install library dependencies
              run: bun install --frozen-lockfile

            - name: Install Playwright browsers
              run: bunx playwright install --with-deps chromium firefox webkit

            - name: Verify library
              run: bun run verify

            - name: Build playground
              working-directory: playground
              run: bun run build

    react-compatibility:
        name: React ${{ matrix.react-version }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                react-version:
                    - 19.0.0
                    - 19.3.1

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.4

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Install playground dependencies
              working-directory: playground
              run: bun install --frozen-lockfile

            - name: Select React version
              run: |
                  bun add --no-save react@${{ matrix.react-version }} react-dom@${{ matrix.react-version }}
                  bun add --cwd playground --no-save react@${{ matrix.react-version }} react-dom@${{ matrix.react-version }}

            - name: Install Playwright browsers
              run: bunx playwright install --with-deps chromium firefox webkit

            - name: Verify React compatibility
              env:
                  CONSUMER_REACT_VERSION: ${{ matrix.react-version }}
              run: bun run typecheck && bun run test && bun run build && bun run pack:consumer
