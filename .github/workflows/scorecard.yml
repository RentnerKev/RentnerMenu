name: OpenSSF Scorecard

on:
    push:
        branches: [main]
    schedule:
        - cron: '31 5 * * 1'

permissions:
    contents: read

concurrency:
    group: scorecard-${{ github.ref }}
    cancel-in-progress: true

jobs:
    analysis:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            security-events: write
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Analyze repository security practices
              uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
              with:
                  results_file: results.sarif
                  results_format: sarif
                  publish_results: true

            - name: Upload findings to code scanning
              uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
              with:
                  sarif_file: results.sarif
                  category: openssf-scorecard
