name: Dependabot Auto-Merge
on:
    workflow_run:
        workflows: [Dependabot Metadata]
        types: [completed]
permissions:
    contents: read
concurrency:
    group: dependabot-auto-merge-${{ github.repository }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
    cancel-in-progress: false
jobs:
    auto-merge:
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'pull_request' &&
            github.event.workflow_run.actor.login == 'dependabot[bot]' &&
            github.event.workflow_run.head_repository.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            actions: read
            contents: write
            pull-requests: write
        steps:
            - name: Checkout trusted main automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  persist-credentials: false
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.4
            - name: Recheck provenance and enable auto-merge
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bun .github/scripts/security/auto-merge.ts
