name: Dependency Review

on:
    pull_request:
    workflow_dispatch:
        inputs:
            base-ref:
                description: Base commit or ref to compare
                required: true
                type: string
            head-ref:
                description: Head commit or ref to compare
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: dependency-review-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    dependency-review:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            # GitHub reviews its dependency graph; Bun lockfile audits run separately.
            - name: Review dependency changes
              uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
              with:
                  base-ref: ${{ inputs.base-ref }}
                  head-ref: ${{ inputs.head-ref }}
                  fail-on-severity: high
                  vulnerability-check: true
                  license-check: false
                  comment-summary-in-pr: never
                  show-openssf-scorecard: true
