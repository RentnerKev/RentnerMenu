name: Dependabot Metadata

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read
    pull-requests: read

jobs:
    metadata:
        if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout trusted metadata automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  path: automation
                  persist-credentials: false
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.4

            - name: Fetch Dependabot metadata
              id: metadata
              uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Classify update
              id: eligibility
              env:
                  MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
                  UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
              run: bun automation/.github/scripts/security/classify-update.ts

            - name: Prepare eligibility marker
              if: steps.eligibility.outputs.update-level != ''
              run: touch "$RUNNER_TEMP/dependabot-auto-merge-eligible"

            - name: Publish eligibility marker
              if: steps.eligibility.outputs.update-level != ''
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: dependabot-auto-merge-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}-${{ steps.eligibility.outputs.update-level }}
                  path: ${{ runner.temp }}/dependabot-auto-merge-eligible
                  if-no-files-found: error
                  retention-days: 1
