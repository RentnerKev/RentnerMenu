name: Publish package
run-name: Publish ${{ github.event.release.tag_name || inputs.tag }}
on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: Existing published stable release tag (vMAJOR.MINOR.PATCH)
                required: true
                type: string
permissions:
    contents: read
concurrency:
    group: npm-publish-${{ github.repository }}-latest
    cancel-in-progress: false
jobs:
    publish:
        name: Publish npm package
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout trusted main automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  path: automation
                  persist-credentials: false
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.4
            - name: Validate stable release identity
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bun automation/.github/scripts/release/identity.ts
            - name: Checkout exact release tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ steps.release.outputs.tag }}
                  path: source
                  fetch-depth: 0
                  persist-credentials: false
            - name: Verify release source and main ancestry
              working-directory: source
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bun "$GITHUB_WORKSPACE/automation/.github/scripts/release/identity.ts" --source-checkout
            - name: Prepare tag-derived package version
              working-directory: source
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bun "$GITHUB_WORKSPACE/automation/.github/scripts/release/prepare.ts"
            - name: Set up Node and npm trusted publishing
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false
            - name: Install exact-source dependencies
              working-directory: source
              run: |
                  bun install --frozen-lockfile
                  bun install --cwd playground --frozen-lockfile
            - name: Install Playwright browsers
              working-directory: source
              run: bunx playwright install --with-deps chromium firefox webkit
            - name: Verify exact-source package
              working-directory: source
              run: bun run verify
            - name: Inspect package
              working-directory: source
              run: npm pack --dry-run --ignore-scripts
            - name: Publish immutable verified artifact
              working-directory: source
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bun "$GITHUB_WORKSPACE/automation/.github/scripts/release/publish.ts"
