name: PR Title
on:
    pull_request_target:
        branches: [main]
        types: [opened, edited, reopened, synchronize, ready_for_review]
permissions:
    contents: read
concurrency:
    group: pr-title-${{ github.event.pull_request.number }}
    cancel-in-progress: true
jobs:
    pr-title:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout trusted base automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Trusted default-branch event commit; the PR base SHA can remain stale.
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.4
            - name: Validate title as data
              env:
                  EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
              run: bun .github/scripts/ci/validate-pr-title.ts
